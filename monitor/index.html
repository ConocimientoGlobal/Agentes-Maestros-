<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1e293b">
<title>🧠 Neural Fellowship — Monitor</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #0f172a; --surface: #1e293b; --surface2: #334155; --border: #475569;
  --text: #f1f5f9; --text2: #94a3b8; --accent: #3b82f6; --green: #22c55e; --red: #ef4444; --yellow: #eab308; --purple: #a855f7;
}
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 80px; max-width: 600px; margin: 0 auto; }
.header { position: sticky; top: 0; z-index: 100; background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px; display: flex; align-items: center; gap: 12px; }
.header h1 { font-size: 18px; font-weight: 700; }
.header .status { margin-left: auto; font-size: 12px; color: var(--green); display: flex; align-items: center; gap: 4px; }
.header .status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
.tabs { display: flex; background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 53px; z-index: 99; }
.tab { flex: 1; padding: 14px 8px; font-size: 12px; font-weight: 600; text-align: center; cursor: pointer; border-bottom: 2px solid transparent; color: var(--text2); transition: all 0.2s; }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab:hover { color: var(--text); }
.content { padding: 16px; }
.section { margin-bottom: 24px; }
.section-title { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text2); margin-bottom: 12px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
.card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.card-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
.card-icon.blue { background: rgba(59,130,246,0.2); } .card-icon.green { background: rgba(34,197,94,0.2); }
.card-icon.purple { background: rgba(168,85,247,0.2); } .card-icon.yellow { background: rgba(234,179,8,0.2); }
.card-icon.red { background: rgba(239,68,68,0.2); }
.card-title { font-weight: 600; font-size: 14px; }
.card-sub { font-size: 12px; color: var(--text2); }
.card-value { font-size: 28px; font-weight: 700; margin-top: 4px; }
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stat-box { background: var(--surface2); border-radius: 8px; padding: 12px; text-align: center; }
.stat-num { font-size: 22px; font-weight: 700; }
.stat-label { font-size: 11px; color: var(--text2); margin-top: 2px; }
.task-item { display: flex; align-items: flex-start; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
.task-item:last-child { border-bottom: none; }
.task-checkbox { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer; transition: all 0.2s; }
.task-checkbox.checked { background: var(--green); border-color: var(--green); }
.task-checkbox.checked::after { content: '✓'; color: white; font-size: 14px; }
.task-content { flex: 1; min-width: 0; }
.task-text { font-size: 13px; line-height: 1.4; word-break: break-word; }
.task-meta { font-size: 11px; color: var(--text2); margin-top: 4px; display: flex; gap: 8px; flex-wrap: wrap; }
.tag { background: var(--surface2); padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 600; }
.tag.auto { background: rgba(34,197,94,0.2); color: var(--green); }
.tag.ia { background: rgba(168,85,247,0.2); color: var(--purple); }
.tag.proj { background: rgba(59,130,246,0.2); color: var(--accent); }
.agent-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.agent-row:last-child { border-bottom: none; }
.agent-emoji { font-size: 24px; width: 36px; text-align: center; }
.agent-info { flex: 1; }
.agent-name { font-weight: 600; font-size: 13px; }
.agent-domain { font-size: 11px; color: var(--text2); }
.agent-count { font-size: 18px; font-weight: 700; color: var(--accent); }
.progress-bar { height: 6px; background: var(--surface2); border-radius: 3px; margin-top: 12px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.5s; }
.project-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 12px; cursor: pointer; transition: all 0.2s; }
.project-card:active { transform: scale(0.98); }
.project-header { display: flex; align-items: center; gap: 12px; }
.project-icon { font-size: 28px; }
.project-info { flex: 1; }
.project-name { font-weight: 700; font-size: 15px; }
.project-desc { font-size: 12px; color: var(--text2); margin-top: 2px; }
.project-stats { display: flex; gap: 16px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
.project-stat { text-align: center; }
.project-stat-num { font-size: 20px; font-weight: 700; }
.project-stat-label { font-size: 10px; color: var(--text2); }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--surface2); color: var(--text); padding: 12px 24px; border-radius: 8px; font-size: 13px; z-index: 1000; border: 1px solid var(--border); opacity: 0; transition: opacity 0.3s; pointer-events: none; }
.toast.show { opacity: 1; }
.refresh-btn { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 16px; }
.refresh-btn:active { opacity: 0.8; }
.loading { text-align: center; padding: 40px; color: var(--text2); }
.spinner { display: inline-block; width: 24px; height: 24px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="header">
  <h1>🧠 Neural Fellowship</h1>
  <div class="status"><span class="dot"></span> <span id="status-text">Online</span></div>
</div>
<div class="tabs">
  <div class="tab active" data-tab="overview" onclick="switchTab('overview')">📊 Overview</div>
  <div class="tab" data-tab="tasks" onclick="switchTab('tasks')">✅ Tareas</div>
  <div class="tab" data-tab="agents" onclick="switchTab('agents')">🤖 Agentes</div>
  <div class="tab" data-tab="projects" onclick="switchTab('projects')">📁 Proyectos</div>
</div>
<div class="content" id="main-content">
  <div class="loading"><div class="spinner"></div><br>Cargando sistema...</div>
</div>
<div class="toast" id="toast"></div>

<script>
const REPO_PATH = '/data/data/com.termux/files/home/tmp/Agentes-Maestros-';
let systemData = null;
let tasksData = null;
let currentTab = 'overview';

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  render();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

async function fetchSystemStatus() {
  try {
    const res = await fetch('/api/status');
    return await res.json();
  } catch(e) { return null; }
}

async function fetchTasks() {
  try {
    const res = await fetch('/api/tasks');
    return await res.json();
  } catch(e) { return null; }
}

async function fetchAgents() {
  try {
    const res = await fetch('/api/agents');
    return await res.json();
  } catch(e) { return null; }
}

async function autoExecute(task) {
  try {
    const res = await fetch('/api/execute', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({task: task})
    });
    const r = await res.json();
    showToast(r.status === 'success' ? '✅ Ejecutado' : '⚠️ ' + (r.status || 'revisar'));
    return r;
  } catch(e) { return null; }
}

function render() {
  const c = document.getElementById('main-content');
  if (!systemData) { c.innerHTML = '<div class="loading"><div class="spinner"></div><br>Cargando...</div>'; return; }
  
  if (currentTab === 'overview') renderOverview(c);
  else if (currentTab === 'tasks') renderTasks(c);
  else if (currentTab === 'agents') renderAgents(c);
  else if (currentTab === 'projects') renderProjects(c);
}

function renderOverview(c) {
  const o = systemData.orchestrator || {};
  const m = systemData.memory || {};
  const l = systemData.learning || {};
  const t = systemData.tasks || {};
  const done = t.total > 0 ? Math.round((t.completadas / t.total) * 100) : 0;
  
  c.innerHTML = `
    <div class="section">
      <div class="stats-grid">
        <div class="card">
          <div class="card-header"><div class="card-icon blue">🤖</div><div><div class="card-title">Maestros</div></div></div>
          <div class="card-value">${systemData.agentes_maestros || 0}</div>
        </div>
        <div class="card">
          <div class="card-header"><div class="card-icon green">🔧</div><div><div class="card-title">Especialistas</div></div></div>
          <div class="card-value">${systemData.agentes_especializados || 0}</div>
        </div>
      </div>
    </div>
    <div class="section">
      <div class="section-title">Sistema</div>
      <div class="card">
        <div class="stats-grid">
          <div class="stat-box"><div class="stat-num">${t.total || 0}</div><div class="stat-label">Tareas</div></div>
          <div class="stat-box"><div class="stat-num">${t.pendientes || 0}</div><div class="stat-label">Pendientes</div></div>
          <div class="stat-box"><div class="stat-num">${l.total_lessons || 0}</div><div class="stat-label">Lecciones</div></div>
          <div class="stat-box"><div class="stat-num">${m.conexiones || 0}</div><div class="stat-label">Conexiones</div></div>
        </div>
      </div>
    </div>
    <div class="section">
      <div class="section-title">Progreso de Tareas</div>
      <div class="card">
        <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text2);margin-bottom:8px;">
          <span>${t.completadas || 0} completadas</span><span>${done}%</span>
        </div>
        <div class="progress-bar"><div class="progress-fill" style="width:${done}%"></div></div>
      </div>
    </div>
    <button class="refresh-btn" onclick="loadData()">🔄 Actualizar</button>
  `;
}

function renderTasks(c) {
  if (!tasksData || !tasksData.tasks) { c.innerHTML = '<div class="loading">Cargando tareas...</div>'; return; }
  const tasks = tasksData.tasks;
  const automatizable = tasks.filter(t => t.route && t.route.automatizable);
  const ia = tasks.filter(t => t.route && !t.route.automatizable);
  
  let html = `<div class="section"><div class="section-title">⚡ Auto-ejecutables (${automatizable.length})</div>`;
  if (automatizable.length === 0) html += '<div class="card"><div class="card-sub">No hay tareas automatizables</div></div>';
  automatizable.forEach(t => {
    html += `<div class="task-item">
      <div class="task-checkbox" onclick="toggleTask(this, '${t.texto.replace(/'/g,"\\'")}')"></div>
      <div class="task-content">
        <div class="task-text">${t.texto}</div>
        <div class="task-meta">
          <span class="tag auto">⚡ ${t.route.maestro.id}</span>
          <span class="tag">${t.route.specialist.id || 'sin asignar'}</span>
          ${t.fuente ? `<span class="tag proj">📁 ${t.fuente.split('/').pop()}</span>` : ''}
        </div>
      </div>
    </div>`;
  });
  html += `</div><div class="section"><div class="section-title">🧠 Requieren IA (${ia.length})</div>`;
  ia.forEach(t => {
    html += `<div class="task-item">
      <div class="task-checkbox"></div>
      <div class="task-content">
        <div class="task-text">${t.texto}</div>
        <div class="task-meta">
          <span class="tag ia">🧠 ${t.route.maestro.id}</span>
          <span class="tag">${t.route.specialist.id || 'sin asignar'}</span>
          <span class="tag auto">${t.route.maestro.confidence}%</span>
          ${t.fuente ? `<span class="tag proj">📁 ${t.fuente.split('/').pop()}</span>` : ''}
        </div>
      </div>
    </div>`;
  });
  html += `</div><button class="refresh-btn" onclick="loadData()">🔄 Actualizar</button>`;
  c.innerHTML = html;
}

function renderAgents(c) {
  if (!tasksData || !tasksData.agent_summary) { c.innerHTML = '<div class="loading">Cargando agentes...</div>'; return; }
  const summary = tasksData.agent_summary;
  let html = `<div class="section"><div class="section-title">🤖 Agentes Activos (${summary.length})</div>`;
  summary.forEach(a => {
    html += `<div class="agent-row">
      <div class="agent-emoji">${a.emoji || '🤖'}</div>
      <div class="agent-info">
        <div class="agent-name">${a.id}</div>
        <div class="agent-domain">${a.domain} • ${a.specialist_count} especialistas</div>
      </div>
      <div class="agent-count">${a.task_count}</div>
    </div>`;
  });
  html += `</div><button class="refresh-btn" onclick="loadData()">🔄 Actualizar</button>`;
  c.innerHTML = html;
}

function renderProjects(c) {
  if (!tasksData || !tasksData.projects) { c.innerHTML = '<div class="loading">Cargando proyectos...</div>'; return; }
  const projects = tasksData.projects;
  let html = `<div class="section"><div class="section-title">📁 Proyectos (${projects.length})</div>`;
  projects.forEach(p => {
    const pDone = p.total > 0 ? Math.round((p.completadas / p.total) * 100) : 0;
    html += `<div class="project-card" onclick="showToast('${p.name}: ${p.total} tareas')">
      <div class="project-header">
        <div class="project-icon">${p.icon || '📁'}</div>
        <div class="project-info">
          <div class="project-name">${p.name}</div>
          <div class="project-desc">${p.description || p.file_count + ' archivos'}</div>
        </div>
      </div>
      <div class="project-stats">
        <div class="project-stat"><div class="project-stat-num">${p.total}</div><div class="project-stat-label">Total</div></div>
        <div class="project-stat"><div class="project-stat-num" style="color:var(--yellow)">${p.pendientes}</div><div class="project-stat-label">Pendientes</div></div>
        <div class="project-stat"><div class="project-stat-num" style="color:var(--green)">${p.completadas}</div><div class="project-stat-label">Hechas</div></div>
        <div class="project-stat"><div class="project-stat-num" style="color:var(--accent)">${p.auto_count}</div><div class="project-stat-label">Auto</div></div>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pDone}%"></div></div>
    </div>`;
  });
  html += `</div><button class="refresh-btn" onclick="loadData()">🔄 Actualizar</button>`;
  c.innerHTML = html;
}

function toggleTask(el, taskText) {
  el.classList.toggle('checked');
  if (el.classList.contains('checked')) {
    autoExecute(taskText);
  }
}

async function loadData() {
  const s = await fetchSystemStatus();
  const t = await fetchTasks();
  systemData = s;
  tasksData = t;
  render();
}

// Initial load
loadData();
setInterval(loadData, 30000);
</script>
</body>
</html>
