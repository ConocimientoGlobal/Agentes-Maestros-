<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1e293b">
<title>🧠 Neural Fellowship</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #0f172a; --surface: #1e293b; --surface2: #334155; --border: #475569;
  --text: #f1f5f9; --text2: #94a3b8; --accent: #3b82f6; --red: #ef4444; --green: #22c55e;
}
body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 100px; }
.header { position: sticky; top: 0; z-index: 100; background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 16px; }
.header h1 { font-size: 17px; font-weight: 700; }
.stats { display: flex; gap: 12px; margin-top: 10px; font-size: 11px; }
.stat { background: var(--surface2); padding: 6px 12px; border-radius: 20px; }
.stat-num { font-weight: 700; }
.content { padding: 16px; }
.section-title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text2); margin-bottom: 10px; margin-top: 16px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 8px; }
.card-top { display: flex; align-items: center; gap: 10px; }
.checkbox { width: 20px; height: 20px; border-radius: 5px; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer; }
.checkbox.checked { background: var(--red); border-color: var(--red); }
.checkbox.checked::after { content: '✕'; color: white; font-size: 11px; font-weight: 700; }
.card-text { flex: 1; font-size: 13px; line-height: 1.3; }
.card-meta { font-size: 10px; color: var(--text2); margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }
.tag { background: var(--surface2); padding: 2px 6px; border-radius: 3px; font-size: 9px; font-weight: 600; }
.project-card { display: flex; align-items: center; gap: 10px; padding: 14px; border-radius: 12px; margin-bottom: 8px; background: var(--surface); border: 1px solid var(--border); }
.project-icon { font-size: 22px; }
.project-info { flex: 1; }
.project-name { font-weight: 600; font-size: 14px; }
.project-desc { font-size: 11px; color: var(--text2); margin-top: 2px; }
.project-count { font-size: 11px; color: var(--text2); margin-left: auto; padding: 4px 10px; background: var(--surface2); border-radius: 10px; }
.fab { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--red); color: white; border: none; padding: 14px 28px; border-radius: 25px; font-size: 14px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 20px rgba(239,68,68,0.4); }
.fab:active { opacity: 0.8; }
.fab:disabled { background: var(--surface2); color: var(--text2); box-shadow: none; }
.empty { text-align: center; padding: 40px 20px; color: var(--text2); }
.toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: var(--surface2); color: var(--text); padding: 12px 24px; border-radius: 8px; font-size: 13px; border: 1px solid var(--border); opacity: 0; transition: opacity 0.3s; z-index: 1000; }
.toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="header">
  <h1>🧠 Neural Fellowship</h1>
  <div class="stats">
    <div class="stat"><span class="stat-num" id="stat-total">0</span> tareas</div>
    <div class="stat"><span class="stat-num" id="stat-projects">0</span> proyectos</div>
  </div>
</div>
<div class="content" id="content"></div>
<button class="fab" id="fab" disabled onclick="confirmDelete()">🗑️ Eliminar seleccionados (<span id="count">0</span>)</button>
<div class="toast" id="toast"></div>

<script>
let tasks = [];
let projects = [];
let selected = new Set();

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

async function load() {
  try {
    const [td, sd] = await Promise.all([
      fetch('/api/tasks').then(r => r.json()),
      fetch('/api/status').then(r => r.json())
    ]);
    tasks = td.tasks || [];
    projects = sd.projects || [];
    render();
  } catch(e) {
    document.getElementById('content').innerHTML = '<div class="empty">Error cargando</div>';
  }
}

function toggleTask(id) {
  if (selected.has(id)) selected.delete(id);
  else selected.add(id);
  updateFab();
}

function toggleProjectTasks(projectName) {
  const projectTasks = tasks.filter(t => t.project === projectName);
  const allSelected = projectTasks.every(t => selected.has(t.id));
  
  if (allSelected) {
    projectTasks.forEach(t => selected.delete(t.id));
  } else {
    projectTasks.forEach(t => selected.add(t.id));
  }
  updateFab();
  render();
}

function updateFab() {
  const fab = document.getElementById('fab');
  const count = document.getElementById('count');
  count.textContent = selected.size;
  fab.disabled = selected.size === 0;
}

function confirmDelete() {
  if (selected.size === 0) return;
  if (confirm(`¿Eliminar ${selected.size} tarea(s)?`)) {
    deleteSelected();
  }
}

async function deleteSelected() {
  const ids = [...selected];
  try {
    await fetch('/api/tasks/delete', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ids})
    });
    selected.clear();
    updateFab();
    showToast(`✅ ${ids.length} tarea(s) eliminada(s)`);
    load();
  } catch(e) {
    showToast('❌ Error eliminando');
  }
}

function render() {
  document.getElementById('stat-total').textContent = tasks.length;
  document.getElementById('stat-projects').textContent = projects.length;
  const c = document.getElementById('content');
  
  if (tasks.length === 0 && projects.length === 0) {
    c.innerHTML = '<div class="empty">🎉 No hay tareas pendientes</div>';
    return;
  }
  
  let html = '';
  
  // Tasks section
  if (tasks.length > 0) {
    html += '<div class="section-title">📋 Tareas pendientes</div>';
    tasks.forEach(t => {
      const isSelected = selected.has(t.id);
      html += `<div class="card">
        <div class="card-top">
          <div class="checkbox ${isSelected ? 'checked' : ''}" onclick="toggleTask('${t.id}')"></div>
          <div class="card-text">${t.texto}</div>
        </div>
        <div class="card-meta">
          <span class="tag">${t.route.maestro.id}</span>
          <span class="tag">${t.route.specialist.id || '—'}</span>
          ${t.project ? `<span class="tag">📁 ${t.project}</span>` : ''}
        </div>
      </div>`;
    });
  }
  
  // Projects section
  if (projects.length > 0) {
    html += '<div class="section-title">📁 Proyectos</div>';
    projects.forEach(p => {
      const projectTasks = tasks.filter(t => t.project === p.name);
      const allSelected = projectTasks.length > 0 && projectTasks.every(t => selected.has(t.id));
      
      html += `<div class="project-card">
        <div class="checkbox ${allSelected ? 'checked' : ''}" onclick="toggleProjectTasks('${p.name.replace(/'/g, "\\'")}')"></div>
        <div class="project-icon">${p.icon}</div>
        <div class="project-info">
          <div class="project-name">${p.name}</div>
          <div class="project-desc">${p.total} tareas (${p.completadas} listas)</div>
        </div>
        <div class="project-count">${projectTasks.filter(t => selected.has(t.id)).length}/${projectTasks.length}</div>
      </div>`;
    });
  }
  
  c.innerHTML = html;
  updateFab();
}

load();
setInterval(load, 30000);
</script>
</body>
</html>
